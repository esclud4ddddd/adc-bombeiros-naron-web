<!DOCTYPE html>
<html lang="es">
<head>
<script>window.__PUBLIC__=true</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.D.C. Bombeiros Narón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#25209a; --accent:#e3262b; --trail:#14705f; --trailAccent:#f5e33b;
  --ink:#14123a; --muted:#5d5f78; --bg:#f4f5fb; --card:#fff; --line:#e3e4ef;
  --hdr:var(--primary); --hl:var(--accent); --radius:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
body.trail{--hdr:#0f3d4a;--hl:var(--trailAccent);--bg:#f1f6f3}
a{color:inherit}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;letter-spacing:.01em;line-height:1.05;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--hdr);color:#fff;border-bottom:4px solid var(--hl);transition:background .3s}
.hbar{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{height:46px;width:auto}
.brand img.sq{border-radius:8px;background:#fff}
.brand b{font-family:"Barlow Condensed";font-weight:800;font-size:20px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.trail .brand b{font-family:Graduate;font-weight:400;font-size:17px}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{padding:8px 11px;border-radius:9px;text-decoration:none;font-weight:600;font-size:15px;opacity:.9;white-space:nowrap}
nav.main a:hover,nav.main a.on{background:rgba(255,255,255,.14);opacity:1}
nav.main a.trailbtn{background:var(--trail);border:1px solid rgba(255,255,255,.25)}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn.on{background:var(--hl);color:#111;border-color:transparent}
#menuBtn{display:none}
#langBtn{font-weight:800;letter-spacing:.06em;margin-left:8px}
@media (max-width:900px){
  nav.main{display:none;position:absolute;top:68px;left:0;right:0;background:var(--hdr);flex-direction:column;padding:10px 14px 16px;gap:4px;box-shadow:0 12px 24px rgba(0,0,0,.25)}
  nav.main.open{display:flex}
  nav.main a{font-size:17px;padding:12px}
  #menuBtn{display:flex;margin-left:auto}
  .brand b{font-size:17px}
}
.editbar{background:var(--hl);color:#111;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px}

/* hero (centered) */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;background:radial-gradient(900px 420px at 50% 0%,#3a35c4 0%,var(--primary) 45%,#120f5c 100%)}
.hero .wm{position:absolute;right:-40px;top:-40px;width:300px;opacity:.07;transform:rotate(-12deg);pointer-events:none}
.hero .inner{position:relative;padding:22px 18px 34px;max-width:820px;margin:0 auto}
.hero .shield{width:92px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero .kicker{display:inline-block;margin-top:10px;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:999px}
.hero h1{font-size:clamp(30px,5.4vw,54px);font-weight:800;text-transform:uppercase;margin-top:8px}
.hero p{font-size:17px;opacity:.9;margin:6px auto 4px;max-width:560px}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chev{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;text-decoration:none;color:#fff;background:var(--accent)}
.btn.green{background:var(--trail)}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35)}
.btn.dark{background:var(--ink)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--primary)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}

section.blk{padding:40px 0 4px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:30px;text-transform:uppercase}
.sh h2 small{display:block;font-family:Barlow;font-size:14px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-bottom:2px}

/* bento */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px}
.bx{position:relative;border-radius:22px;padding:20px;color:#fff;text-decoration:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:var(--c,var(--primary));box-shadow:0 10px 26px rgba(20,18,58,.13);transition:transform .15s,box-shadow .15s;border:0;text-align:left}
.bx:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(20,18,58,.22)}
.bx .bi{position:absolute;top:18px;left:20px;font-size:30px;line-height:1}
.bx .go{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:16px}
.bx h3{font-size:26px;text-transform:uppercase}
.bx small{opacity:.88;font-size:14.5px;margin-top:3px;display:block}
.bx.big{grid-column:span 2;grid-row:span 2;background:linear-gradient(150deg,#0f3d4a 0%,var(--trail) 100%)}
.bx.big img{position:absolute;right:20px;top:20px;width:32%;max-width:170px;border-radius:20px;background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.3);transform:rotate(4deg)}
.bx.big h3{font-family:Graduate;font-weight:400;text-transform:none;font-size:clamp(28px,3.4vw,40px)}
.bx.big .ybar{align-self:flex-start;background:var(--trailAccent);color:#0f3d4a;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:10px;font-size:15px}
.bx.big .mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bx.big .mods span{background:rgba(255,255,255,.15);border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:600}
.bx.wide{grid-column:span 2}
.bx.wide .head{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.bx.wide .hl{font-family:"Barlow Condensed";font-weight:700;font-size:22px;line-height:1.1;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bx.wide .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35}
.bx.light{color:#111}
.bx .hart,.bx .socart{z-index:0}
.bx .hart .mtbox{top:4%;bottom:auto;height:44%}
.bx.big:after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to top,rgba(8,38,46,.55) 0,transparent 55%);pointer-events:none}
.bx .tlbl{display:none}
.bx h3,.bx small,.bx .ybar,.bx .mods{position:relative;z-index:1}
.bx .bi,.bx .go,.bx.big img{z-index:2}
.bx .ctr{position:absolute;bottom:10px;right:10px;z-index:3}
.bx .socart svg.net{width:70%;opacity:.4}
.bx .socart .fl svg.ico{width:22px;height:22px}
.bento{grid-auto-flow:dense}
.bx.s2{grid-column:span 2}.bx.s4{grid-column:span 4}
@media (max-width:820px){
  .bento{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .bx.big{grid-column:span 2;grid-row:span 2}
  .bx.wide,.bx.s2,.bx.s4{grid-column:span 2}
  .bx h3{font-size:21px}
  .bx.big img{width:104px;right:14px;top:14px}
  .bx.big h3{font-size:28px}
  .bento{grid-auto-rows:160px}
}

/* about window */
.about{position:relative;display:grid;grid-template-columns:1fr 260px;gap:26px;align-items:center;background:var(--card);border-radius:24px;padding:28px;border:1px solid var(--line);overflow:hidden;box-shadow:0 8px 24px rgba(20,18,58,.06)}
.about:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(var(--accent),var(--primary))}
.about h2{font-size:32px;text-transform:uppercase;color:var(--primary)}
.about p{font-size:17px;color:#33354d;margin:10px 0 16px}
.about .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.about .chips span{background:#eef0fb;color:var(--primary);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.about img{width:100%;max-width:230px;justify-self:center;filter:drop-shadow(0 10px 18px rgba(20,18,58,.25))}
@media (max-width:760px){.about{grid-template-columns:1fr;text-align:center;padding:24px 20px}.about img{max-width:120px;order:-1}.about .chips{justify-content:center}}

/* news */
.feat{display:grid;grid-template-columns:1.1fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line);text-decoration:none;box-shadow:0 8px 24px rgba(20,18,58,.07);margin-bottom:14px}
.feat .ph{min-height:260px;background:linear-gradient(135deg,var(--primary),#120f5c);display:flex;align-items:center;justify-content:center;font-size:70px;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .bd{padding:24px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.feat h3{font-size:30px}
.feat p{margin:0;color:var(--muted);font-size:16px}
.meta{font-size:13px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
body.trail .meta{color:var(--trail)}
@media (max-width:760px){.feat{grid-template-columns:1fr}.feat .ph{min-height:190px}.feat h3{font-size:24px}}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.nrow{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;align-items:stretch;position:relative}
.nrow .ph{background:linear-gradient(135deg,var(--primary),#120f5c);display:flex;align-items:center;justify-content:center;font-size:34px;position:relative;min-height:104px}
.nrow .bd{padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.nrow h3{font-size:19px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* page */
.phead{color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c,var(--primary)),color-mix(in srgb,var(--c,var(--primary)) 50%,#000))}
.phead .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.phead .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.7))}
.phead .wrap{position:relative;padding-top:22px;padding-bottom:30px}
.phead.hasimg .wrap{padding-top:90px}
.crumbs{font-size:14px;opacity:.88;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.phead .row{display:flex;gap:16px;align-items:center}
.phead .bigic{font-size:40px;width:68px;height:68px;border-radius:18px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:800;flex:none}
.phead h1{font-size:clamp(30px,5.2vw,54px);text-transform:uppercase}
body.trail .phead h1{font-family:Graduate;font-weight:400;text-transform:none;font-size:clamp(26px,4.4vw,44px)}
.phead .sub{opacity:.92;font-size:17px;margin-top:4px}
.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin-top:8px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tools .btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.tools .btn.danger{background:#b3261e;border-color:transparent}
.content{display:grid;gap:22px;padding-top:26px;padding-bottom:10px}
.body{background:var(--card);border-radius:var(--radius);padding:22px 24px;border:1px solid var(--line);font-size:17px}
.body p{margin:0 0 12px}.body p:last-child{margin:0}
.body ul{margin:0 0 12px;padding-left:20px}.body li{margin:3px 0}
.body h2{font-size:24px;text-transform:uppercase;color:var(--primary);margin:22px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.body h2:first-child{margin-top:0;padding-top:0;border:0}
body.trail .body h2{color:var(--trail)}
.body a{color:var(--primary);word-break:break-word}
body.trail .body a{color:var(--trail)}
.links{display:flex;flex-wrap:wrap;gap:10px}
h2.sub2{font-size:24px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* list cards (children) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;box-shadow:0 4px 14px rgba(20,18,58,.05);transition:transform .12s,box-shadow .12s;border-left:6px solid var(--c,var(--primary));text-align:left;min-height:84px}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,18,58,.12)}
.card .ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--c,var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-family:"Barlow Condensed";font-weight:800}
.card .ic.light{color:#111}
svg.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.card .ic svg.ico{width:26px;height:26px}
.bx .bi svg.ico{width:30px;height:30px}
.phead .bigic svg.ico{width:36px;height:36px}
.ph svg.ico{width:46px;height:46px;opacity:.55;color:#fff}
.feat .ph svg.ico{width:72px;height:72px}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.icgrid button{height:42px;border:1px solid #d5d7e6;border-radius:10px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.icgrid button svg.ico{width:22px;height:22px}
.icgrid button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.paste{border:2px dashed #cfd1e2;border-radius:10px;padding:10px;font-size:14px;color:var(--muted);text-align:center;outline:none}
.paste:focus{border-color:var(--primary);background:#f5f6fd}
.card .tx{flex:1;min-width:0}
.card h3{font-size:21px;text-transform:uppercase}
.card small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.card .ar{color:var(--muted);font-size:18px}
.card.add{border:2px dashed #b8bad0;justify-content:center;color:var(--muted);box-shadow:none;font-weight:700;background:transparent}
.ctr{display:flex;gap:4px;flex:none}
.ctr button{background:#eef0f6;color:var(--ink);border:0;border-radius:8px;width:32px;height:32px;font-size:14px}
.ctr button.d{background:#fde8e7;color:#b3261e}

/* gallery / docs / tracks */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#ddd;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;width:28px;height:28px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vid{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vid video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.vid figcaption{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:14px;color:var(--muted)}
.vid .x{margin-left:auto;background:#fde8e7;color:#b3261e;border:0;border-radius:8px;width:28px;height:28px}
.gal .enc{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.gal .cv{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.gal .cv.on{background:var(--hl);color:#111}
.docs{display:grid;gap:8px}
.doc{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.doc .fi{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;background:var(--primary);flex:none;font-family:"Barlow Condensed";letter-spacing:.04em}
.doc .x{margin-left:auto;background:#fde8e7;color:#b3261e;border:0;border-radius:8px;width:30px;height:30px}
.doc small{color:var(--muted)}
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.track .tt{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.track .tt b{font-size:17px}
.track .tt .sp{flex:1}
.tstats{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;background:#f7f8fc}
.tstats div{font-size:13px;color:var(--muted)}
.tstats b{display:block;font-family:"Barlow Condensed";font-size:26px;color:var(--ink);line-height:1}
.tsvg{display:grid;grid-template-columns:1fr 1fr}
.tsvg svg{width:100%;height:auto;display:block}
.tsvg .map{background:linear-gradient(#eef4ef,#e2ece5);border-right:1px solid var(--line)}
@media (max-width:760px){.tsvg{grid-template-columns:1fr}.tsvg .map{border-right:0;border-bottom:1px solid var(--line)}}
.empty{color:var(--muted);background:var(--card);border:2px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center}
.drop{border:2px dashed var(--primary);background:color-mix(in srgb,var(--primary) 6%,#fff);border-radius:var(--radius);padding:18px;text-align:center;color:var(--ink);cursor:pointer}
body.trail .drop{border-color:var(--trail);background:color-mix(in srgb,var(--trail) 7%,#fff)}
.drop.over{filter:brightness(.95)}


/* carrusel de noticias (mismos parámetros que Bombeiros Narón) */
.car{position:relative;overflow:hidden;border-radius:18px;height:clamp(240px,36vw,430px);background:var(--ink);box-shadow:0 10px 26px rgba(20,18,58,.15)}
.ctrack{display:flex;height:100%;transition:transform .7s ease}
.slenc{position:absolute;top:12px;right:12px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.slide{position:relative;flex:0 0 100%;min-width:0;display:flex;align-items:flex-end;text-decoration:none;color:#fff;background:linear-gradient(to top,rgba(10,14,20,.9),rgba(10,14,20,.1) 70%),var(--primary);background-size:cover;background-position:center}
.slide .cap{display:block;padding:26px 64px 46px;max-width:900px}
.slide small{display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:6px}
.slide b{font:700 clamp(1.25rem,2.6vw,2rem)/1.15 "Barlow Condensed",sans-serif;text-wrap:balance}
.car .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#14181f;font-size:1.6rem;line-height:1;cursor:pointer}
.car .prev{left:12px}.car .next{right:12px}
.car .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:8px;justify-content:center}
.car .dots button{width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:transparent;padding:0;cursor:pointer}
.car .dots button[aria-current="true"]{background:#fff}
@media (prefers-reduced-motion:reduce){.ctrack{transition:none}}
@media (max-width:760px){.slide .cap{padding:16px 16px 40px}.car .nav{display:none}}
/* tarjetas de noticia */
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ncard img.foto{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}

/* ---------- theme ---------- */
function applyMeta(){ const c=(S.meta&&S.meta.colors)||{}; const r=document.documentElement.style;
  ["primary","accent","trail","trailAccent"].forEach(k=>{ if(c[k]) r.setProperty("--"+k,c[k]); }); }

/* ---------- data ---------- */
async function boot(){
  try{ GLC=await (await fetch("gl.json")).json(); }catch(e){}
  document.documentElement.lang=LANG;
  if(window.__PUBLIC__){
    try{ const t=await (await fetch("datos.json?v="+Date.now(),{cache:"no-store"})).text(); S.pubRaw=t; S.defaults=JSON.parse(t); }catch(e){ S.defaults={meta:{},nodes:[]}; }
    useDefaults(); S.loaded=true; route(); return; }
  try{ const r=await fetch("seed.json"); S.defaults=await r.json(); }catch(e){ S.defaults={meta:{},nodes:[]}; }
  useDefaults(); S.loaded=true; route();
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets")]);
    S.db=db; S.user=user; S.assets=assets;
    if(user&&db){
      try{ S.owner=!!(await Promise.resolve(user.isOwner())); }catch(e){}
      try{ const w=await Promise.resolve(user.can("data.write")); S.contrib = S.owner || w===true; }catch(e){}
    }
    $("#editBtn").hidden=!S.owner||!!window.__PUBLIC__;
    if(!db){ route(true); return; }
    let metaData, site, trail, settled=false;
    const timer=setTimeout(()=>{ if(!settled) toast("No se pudo conectar con los datos; se muestra el contenido base."); },10000);
    const combine=()=>{ if(metaData===undefined||site===undefined||trail===undefined) return; settled=true; clearTimeout(timer);
      if(metaData&&metaData.seeded){ S.fromDb=true; S.meta=metaData; S.nodes=new Map([...site,...trail].map(d=>[d.id,d])); applyMeta(); }
      route(true); };
    db.doc("meta/site").onSnapshot(s=>{ metaData=s.exists?s.data():null; combine(); },()=>{ clearTimeout(timer); });
    db.collection("site").onSnapshot(s=>{ site=s.docs.map(d=>({...d.data(),id:d.id})); combine(); },()=>{});
    db.collection("trail").onSnapshot(s=>{ trail=s.docs.map(d=>({...d.data(),id:d.id})); combine(); },()=>{});
  }catch(e){ console.log(e); route(true); }
}
function useDefaults(){ S.meta=JSON.parse(JSON.stringify(S.defaults.meta||{})); S.nodes=new Map((S.defaults.nodes||[]).map(n=>[n.id,JSON.parse(JSON.stringify(n))])); applyMeta(); }

function q(path,fn){ const prev=S.writeQ[path]||Promise.resolve(); const p=prev.catch(()=>{}).then(fn); S.writeQ[path]=p; return p; }
function clean(n){ const o={...n}; delete o.id; delete o.col; return JSON.parse(JSON.stringify(o)); }
async function saveNode(n){ if(!S.db||!S.fromDb){ toast("Sin conexión con los datos compartidos."); return false; }
  S.nodes.set(n.id,n); route(true); const path=colOf(n.id)+"/"+n.id;
  try{ await q(path,()=>S.db.doc(path).set(clean(n))); return true; }catch(e){ fail(e); return false; } }
async function delNode(id){ if(!S.db||!S.fromDb) return; const all=[S.nodes.get(id),...descendants(id)].filter(Boolean);
  const paths=all.map(n=>colOf(n.id)+"/"+n.id); all.forEach(n=>S.nodes.delete(n.id)); route(true);
  for(const p of paths){ try{ await q(p,()=>S.db.doc(p).delete()); }catch(e){ fail(e); break; } } }
async function saveMeta(m){ if(!S.db||!S.fromDb) return; S.meta=m; applyMeta(); route(true);
  try{ await q("meta/site",()=>S.db.doc("meta/site").set({...m,seeded:true})); }catch(e){ fail(e); } }
function fail(e){ console.log(e); const c=e&&e.code;
  if(c==="invalid_argument"){ toast("No tienes permiso para editar esto."); }
  else if(c==="quota_exceeded") toast("Se ha llenado el espacio de datos. Elimina contenido antiguo.");
  else toast("No se pudo guardar. Inténtalo de nuevo."); }

/* ---------- routing ---------- */
let lastHash=null;
function route(keepScroll){
  if(!S.loaded) return;
  const h=location.hash.slice(1)||"inicio";
  const id=h.startsWith("n-")?h.slice(2):null;
  const node=id&&S.nodes.get(id);
  const tr=!!(node&&isTrail(node.id));
  document.body.classList.toggle("trail",tr);
  const logo=$("#logo"); logo.src=tr?"trail.jpg":"escudo.png"; logo.classList.toggle("sq",tr);
  $("#brandName").textContent=tr?"Trail Costa Ártabra":"A.D.C. BOMBEIROS NARÓN";
  $("#brand").href=tr?"#n-trail":"#inicio";
  renderNav(node); renderFoot(); renderEditbar();
  if(node) renderNode(node); else renderHome();
  { const nav=$("#nav"); if(nav&&nav._s){ nav._s.destroy(); nav._s=null; } } setTimeout(initSort,0);
  if(!keepScroll||lastHash!==h) window.scrollTo(0,0);
  lastHash=h;
}
window.addEventListener("hashchange",()=>{ $("#nav").classList.remove("open"); route(); });

/* ---------- cards ---------- */
function ctrls(n,siblings){
  if(!canEdit(n)) return "";
  const idx=siblings?siblings.indexOf(n):-1;
  return `<span class="ctr">${idx>0?`<button data-act="up" data-id="${esc(n.id)}" title="Mover a la izquierda / antes">◀</button>`:""}${siblings&&idx>-1&&idx<siblings.length-1?`<button data-act="down" data-id="${esc(n.id)}" title="Mover a la derecha / después">▶</button>`:""}<button data-act="edit" data-id="${esc(n.id)}" title="Editar">✎</button><button class="d" data-act="del" data-id="${esc(n.id)}" title="Eliminar">🗑</button></span>`;
}
function card(n,siblings){
  const ic=n.icon||""; const direct=n.kind==="link"&&n.link&&!S.edit;
  const href=direct?n.link:"#n-"+n.id;
  return `<a class="card" data-id="${esc(n.id)}" ${n.color?`style="--c:${esc(n.color)}"`:""} href="${esc(href)}" ${direct?'target="_blank" rel="noopener"':""}>
    ${coverOf(n)&&n.cover?`<span class="ic ph2"><img src="${esc(blobUrl(coverOf(n)))}" alt="" style="object-position:${posOf(coverOf(n))}"></span>`:`<span class="ic ${lum(n.color)>0.7?"light":""}">${icon(ic)}</span>`}
    <span class="tx"><h3>${esc(tr(n,"title"))}</h3>${tr(n,"sub")?`<small>${esc(tr(n,"sub"))}</small>`:""}${n.date&&n.kind!=="news"?`<small>${esc(fdate(n.date))}</small>`:""}</span>
    ${ctrls(n,siblings)||`<span class="ar">${direct?"↗":"›"}</span>`}</a>`;
}
function deepCover(n){ const own=coverOf(n); if(own&&(n.cover||!kids(n.id).length)) return own; if(own) return own;
  const ds=descendants(n.id); const withCover=ds.slice().reverse().find(d=>d.cover&&coverOf(d)); if(withCover) return coverOf(withCover);
  const anyImg=ds.slice().reverse().find(d=>coverOf(d)); return anyImg?coverOf(anyImg):null; }
function pcard(n,siblings){
  const c=deepCover(n); const direct=n.kind==="link"&&n.link&&!S.edit; const href=direct?n.link:"#n-"+n.id;
  return `<a class="pcard" data-id="${esc(n.id)}" ${n.color?`style="--c:${esc(n.color)}"`:""} href="${esc(href)}" ${direct?'target="_blank" rel="noopener"':""}>
    <div class="pimg">${c?`<img src="${esc(blobUrl(c))}" alt="" loading="lazy" style="object-position:${posOf(c)}">`:icon(n.icon)}</div>
    <div class="pbd"><h3>${esc(tr(n,"title"))}</h3>${tr(n,"sub")?`<small>${esc(tr(n,"sub"))}</small>`:""}${tr(n,"body")?`<p class="pex">${esc(plain(tr(n,"body")))}</p>`:""}${n.date?`<small>${esc(fdate(n.date))}</small>`:""}</div>${ctrls(n,siblings)}</a>`;
}
function phOf(n,cls){ const c=coverOf(n); return `<div class="ph">${c?`<img src="${esc(blobUrl(c))}" alt="" loading="lazy" style="object-position:${posOf(c)}">`:icon("i:news")}</div>`; }
function feat(n){ return `<a class="feat" href="#n-${esc(n.id)}">${phOf(n)}<div class="bd"><span class="meta">${esc(fdate(n.date))}${tr(n,"sub")?" · "+esc(tr(n,"sub")):""}</span><h3>${esc(tr(n,"title"))}</h3><p>${esc(plain(tr(n,"body")).slice(0,220))}${plain(tr(n,"body")).length>220?"…":""}</p></div></a>`; }
function nrow(n,siblings){ return `<a class="nrow" href="#n-${esc(n.id)}">${phOf(n)}<div class="bd"><span class="meta">${esc(fdate(n.date))}${tr(n,"sub")?" · "+esc(tr(n,"sub")):""}</span><h3>${esc(tr(n,"title"))}</h3>${canEdit(n)?ctrls(n,null):""}</div></a>`; }


/* ---------- noticias: portada como en Bombeiros Narón ---------- */
const DIAS_NOTICIA=4, MIN_NOTICIAS=4;
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const diaBase=n=>/^\d{4}-\d{2}-\d{2}/.test(n.date||"")?String(n.date).slice(0,10):/^\d{4}-\d{2}$/.test(n.date||"")?n.date+"-01":/^\d{4}$/.test(n.date||"")?n.date+"-01-01":(n.created||"");
const diaNoticia=n=>{const b=diaBase(n),f=/^\d{4}-\d{2}-\d{2}/.test(n.fijada||'')?n.fijada.slice(0,10):'';return f>b?f:b};
const caducada=n=>{const f=diaNoticia(n);if(!f)return false;const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+DIAS_NOTICIA);return d.toISOString().slice(0,10)<=hoyISO()};
const porPortada=(l,manual)=>[...l].sort((a,b)=>manual?((+a.order||0)-(+b.order||0)):(diaNoticia(b).localeCompare(diaNoticia(a))||(+b.order||0)-(+a.order||0)));
const isManual=pid=>{ const p=S.nodes.get(pid); return !!(p&&p.manualOrder); };
function newsAll(parent,conRetiradas){ return porPortada(kids(parent).filter(n=>n.kind==="news"&&(conRetiradas||!n.retirada)),isManual(parent)); }
function portada(){ const l=newsAll("noticias").filter(n=>!n.sinPortada); const byDate=porPortada(l,false); const nu=byDate.filter(n=>!caducada(n)); const sel=new Set((nu.length>=MIN_NOTICIAS?nu:byDate.slice(0,MIN_NOTICIAS)).map(n=>n.id)); return l.filter(n=>sel.has(n.id)); }
const enPortada=n=>portada().some(x=>x.id===n.id);
const posOf=f=>/^\d{1,3}% \d{1,3}%$/.test((f&&f.pos)||'')?f.pos:'50% 50%';
function fechaN(n){ return n.date?fdate(n.date):""; }
let carI=0, carTick=0;
function carHTML(){
  const l=portada().slice(0,6);
  const sl=l.length?l.map(n=>{const p=coverOf(n),u=n.link,t=u?'a':'a';return `<${t} href="${esc(u||("#n-"+n.id))}" ${u?'target="_blank" rel="noopener"':''} class="slide"${p?` style="background-image:linear-gradient(to top,rgba(10,14,20,.92),rgba(10,14,20,.08) 70%),url('${esc(blobUrl(p))}');background-position:center,${posOf(p)}"`:''}>${p&&canEdit(n)?`<button class="slenc" data-act="encuadre" data-id="${esc(n.id)}" data-fid="${esc(p.id)}">⌖ Encuadrar foto</button>`:""}<span class="cap"><small>${esc(tr(n,"sub")||T("Noticias"))}${n.date?' · '+esc(fechaN(n)):''}</small><b>${esc(tr(n,"title"))}</b></span></${t}>`}).join(''):`<div class="slide"><span class="cap"><small>${T("Noticias de prensa")}</small><b>${T("Aún no hay noticias publicadas")}</b></span></div>`;
  return `<div class="car" id="car" aria-roledescription="carrusel" aria-label="Noticias de prensa"><div class="ctrack" id="ctrack">${sl}</div>`+(l.length>1?`<button class="nav prev" data-act="car" data-d="-1" aria-label="Noticia anterior">‹</button><button class="nav next" data-act="car" data-d="1" aria-label="Noticia siguiente">›</button><div class="dots">${l.map((_,i)=>`<button data-act="car" data-i="${i}" aria-label="Noticia ${i+1}"></button>`).join('')}</div>`:'')+`</div>`;
}
function carGo(i){ carTick=0; const t=document.getElementById('ctrack'); if(!t) return; const n=t.children.length; carI=(i+n)%n; t.style.transform=`translateX(-${carI*100}%)`; document.querySelectorAll('#car .dots button').forEach((b,k)=>b.setAttribute('aria-current',k===carI)); }
setInterval(()=>{ const c=document.getElementById('car'); const m=S.meta||{}; if(!c||m.carAuto===false||matchMedia('(prefers-reduced-motion:reduce)').matches||c.matches(':hover,:focus-within')) return;
  if(++carTick>=Math.min(30,Math.max(3,+m.carSecs||6))) carGo(carI+1); },1000);

function newsSummary(n){
  const raw=String(tr(n,"body")||""); if(!raw) return "";
  const urls=[...new Set((raw.match(/https?:\/\/[^\s<)]+/g)||[]).filter(u=>u!==n.link))];
  const main=raw.split(/\n\s*(?:También en|Tamén en)\s*:?/i)[0].replace(/https?:\/\/[^\s<)]+/g,"").trim();
  const dom=u=>{ try{ return new URL(u).hostname.replace(/^www\./,"").replace(/^diariodeferrol\.elidealgallego\.com$/,"diariodeferrol.com"); }catch(e){ return "enlace"; } };
  const NAMES={"ferrol360.es":"Ferrol 360","diariodeferrol.com":"Diario de Ferrol","naron.gal":"Concello de Narón","cope.es":"COPE","lavozdegalicia.es":"La Voz de Galicia","elespanol.com":"El Español","enfoques.gal":"Enfoques","utmb.world":"UTMB"};
  return `<p class="nsum">${esc(plain(main))}</p>${urls.length?`<div class="nalso">${LANG==="gl"?"Tamén en":"También en"}: ${urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(NAMES[dom(u)]||dom(u))}</a>`).join(" · ")}</div>`:""}`;
}
function yearSel(n){

let trailRAF=0;
function startTrailAnim(){
  cancelAnimationFrame(trailRAF);
  const items=[...document.querySelectorAll(".hart")].map(art=>{ const path=art.querySelector(".prof"), dot=art.querySelector(".tdot"); if(!path||!dot) return null;
    const L=path.getTotalLength(); path.style.strokeDasharray=L; return {art,path,dot,L}; }).filter(Boolean);
  if(!items.length) return;
  const place=(it,f)=>{ const pt=it.path.getPointAtLength(it.L*f); it.dot.style.left=(pt.x/1200*100)+"%"; it.dot.style.top=(pt.y/260*100)+"%"; it.path.style.strokeDashoffset=it.L*(1-f); };
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ items.forEach(it=>place(it,1)); return; }
  const t0=performance.now(), D=12000;
  const step=now=>{ const live=items.filter(it=>it.art.isConnected); if(!live.length) return; const f=Math.min(1,(((now-t0)%D)/D)/0.85); live.forEach(it=>place(it,f)); trailRAF=requestAnimationFrame(step); };
  trailRAF=requestAnimationFrame(step);
}

const trackCache={};
async function parseTrack(f){
  if(trackCache[f.id]) return trackCache[f.id];
  const txt=await (await fetch(blobUrl(f))).text();
  const doc=new DOMParser().parseFromString(txt,"application/xml"); let pts=[];
  const tp=[...doc.getElementsByTagName("trkpt"),...doc.getElementsByTagName("rtept")];
  if(tp.length){ pts=tp.map(p=>{ const e=p.getElementsByTagName("ele")[0]; return [+p.getAttribute("lat"),+p.getAttribute("lon"),e?+e.textContent:null]; }); }
  else { const cs=[...doc.getElementsByTagName("coordinates")]; let best=[];
    cs.forEach(c=>{ const arr=c.textContent.trim().split(/\s+/).map(s=>s.split(",").map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])); if(arr.length>best.length) best=arr; });
    if(!best.length){ best=[...doc.getElementsByTagName("gx:coord")].map(c=>c.textContent.trim().split(/\s+/).map(Number)); }
    pts=best.map(a=>[a[1],a[0],a.length>2?a[2]:null]); }
  pts=pts.filter(p=>isFinite(p[0])&&isFinite(p[1]));
  const R=6371000, rad=x=>x*Math.PI/180; let d=0, up=0, dn=0, lastE=null; const prof=[];
  for(let i=0;i<pts.length;i++){ if(i){ const [a,b]=pts[i-1], [c,e]=pts[i]; const dl=rad(c-a), dg=rad(e-b);

}
async function drawTrack(f){
  const box=document.querySelector(`[data-track="${CSS.escape(f.id)}"] .tbody`); if(!box) return;
  try{ const t=await parseTrack(f); if(t.pts.length<2){ box.textContent=T("No se encontraron puntos en el archivo."); return; }
    const W=600,H=380,P=24; const lats=t.pts.map(p=>p[0]), lons=t.pts.map(p=>p[1]);
    const mnLa=Math.min(...lats),mxLa=Math.max(...lats),mnLo=Math.min(...lons),mxLo=Math.max(...lons);
    const k=Math.cos((mnLa+mxLa)/2*Math.PI/180); const sx=(mxLo-mnLo)*k||1e-6, sy=(mxLa-mnLa)||1e-6;
    const sc=Math.min((W-2*P)/sx,(H-2*P)/sy); const ox=(W-sx*sc)/2, oy=(H-sy*sc)/2;
    const X=lo=>ox+(lo-mnLo)*k*sc, Y=la=>H-oy-(la-mnLa)*sc;
    const step=Math.max(1,Math.floor(t.pts.length/1500));
    const path=t.pts.filter((_,i)=>i%step===0||i===t.pts.length-1).map((p,i)=>(i?"L":"M")+X(p[1]).toFixed(1)+" "+Y(p[0]).toFixed(1)).join("");
    const s=t.pts[0], e=t.pts[t.pts.length-1]; const col=getComputedStyle(document.body).getPropertyValue("--trail").trim()||"#14705f";
    const map=`<svg class="map" viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="${path}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(e[1])}" cy="${Y(e[0])}" r="8" fill="#e3262b" stroke="#fff" stroke-width="3"/><circle cx="${X(s[1])}" cy="${Y(s[0])}" r="8" fill="#1fa25a" stroke="#fff" stroke-width="3"/>
      <text x="${W-12}" y="22" text-anchor="end" font-size="13" fill="#5d5f78" font-family="Barlow">N ↑</text></svg>`;
    let prof="";
    if(t.prof.length>2){ const PW=600,PH=380,L=46,B=30,T=16,Rr=14; const els=t.prof.map(p=>p[1]); const mn=Math.min(...els), mx=Math.max(...els);
      const lo=Math.floor(mn/50)*50, hi=Math.max(lo+50,Math.ceil(mx/50)*50); const D=t.dist||1;
      const px=x=>L+x/D*(PW-L-Rr), py=y=>PH-B-(y-lo)/(hi-lo)*(PH-B-T);
      const ps=Math.max(1,Math.floor(t.prof.length/800)); const pp=t.prof.filter((_,i)=>i%ps===0);
      const line=pp.map((p,i)=>(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join("");
      let grid=""; const yStep=(hi-lo)>600?200:(hi-lo)>250?100:50;
      for(let y=lo;y<=hi;y+=yStep) grid+=`<line x1="${L}" x2="${PW-Rr}" y1="${py(y)}" y2="${py(y)}" stroke="#e3e4ef"/><text x="${L-6}" y="${py(y)+4}" text-anchor="end" font-size="12" fill="#5d5f78">${y}</text>`;
      const km=D/1000, ks=km>20?5:km>8?2:1;
      for(let x=0;x<=km;x+=ks) grid+=`<text x="${px(x*1000)}" y="${PH-10}" text-anchor="middle" font-size="12" fill="#5d5f78">${x} km</text>`;
      prof=`<svg viewBox="0 0 ${PW} ${PH}"><text x="${L}" y="12" font-size="12" fill="#5d5f78">m</text>${grid}
        <path d="${line}L${px(pp[pp.length-1][0])} ${PH-B}L${L} ${PH-B}Z" fill="${col}" opacity=".22"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.5"/></svg>`; }
    else prof=`<div class="note" style="display:flex;align-items:center;justify-content:center">${T("Este archivo no incluye altitudes")}</div>`;
    const eles=t.prof.map(p=>p[1]);
    box.className="";
    box.innerHTML=`<div class="tstats"><div><b>${(t.dist/1000).toFixed(1)} km</b>${T("Distancia")}</div>${eles.length?`<div><b>${Math.round(t.up)} m</b>${T("Desnivel +")}</div><div><b>${Math.round(t.dn)} m</b>${T("Desnivel −")}</div><div><b>${Math.round(Math.max(...eles))} m</b>${T("Altitud máx.")}</div>`:""}</div>
      <div class="tsvg">${map}${prof}</div>`;
  }catch(e){ console.log(e); box.textContent="No se pudo leer el track."; }
}

/* ---------- uploads ---------- */
function kindOf(f){ const ext=(f.name.split(".").pop()||"").toLowerCase();
  return [/^(jpe?g|png|webp|gif|svg|avif)$/.test(ext)||(f.type||"").startsWith("image/")?"image":/^(mp4|m4v|mov|webm|ogv)$/.test(ext)||(f.type||"").startsWith("video/")?"video":(ext==="gpx"||ext==="kml")?"track":"doc",ext]; }
async function uploadOne(f){
  const [kind,ext]=kindOf(f); let blob=f;
  if(kind==="track") blob=new Blob([await f.text()],{type:"text/plain"});
  if(kind==="image"&&f.size>2.5e6&&ext!=="gif"&&ext!=="svg") blob=await shrink(f);
  const r=await S.assets.upload(blob);
  return {id:r.id,name:f.name,kind,ext,size:r.sizeBytes||f.size};
}
function pickFiles(id){ const i=document.createElement("input"); i.type="file"; i.multiple=true;
  i.accept="image/*,video/*,.mp4,.mov,.webm,.pdf,.gpx,.kml,.txt,.csv,.json";
  i.onchange=()=>uploadFiles(id,[...i.files]); i.click(); }
async function uploadFiles(id,files){
  if(!files.length) return;
  if(!S.assets){ toast("Tu acceso no permite subir archivos."); return; }
  let ok=0;
  for(const f of files){
    if(f.size>20*1024*1024&&kindOf(f)[0]!=="image"){ toast(`«${f.name}» pesa ${Math.round(f.size/1048576)} MB: el máximo es 20 MB por archivo. Recórtalo o comprímelo y vuelve a intentarlo.`,6000); continue; }
    toast("Subiendo "+f.name+"…",1800);
    try{ const rec=await uploadOne(f); const n={...S.nodes.get(id)}; n.files=[...(n.files||[]),rec]; await saveNode(n); ok++; }
    catch(e){ console.log(e); toast(`No se pudo subir «${f.name}». Admitidos: imágenes, vídeos MP4/MOV/WEBM, PDF, GPX, KML (máx. 20 MB por archivo). Word/Excel: guárdalos como PDF.`,6000); }
  }
  if(ok) toast(ok===1?"Archivo añadido":ok+" archivos añadidos");
}
function shrink(file){ return new Promise((res)=>{ const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const m=2400, s=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file);},"image/jpeg",0.86); };
  img.onerror=()=>res(file); img.src=u; }); }
function removeFileOf(id,fid){ return removeFile(id,fid); }
async function removeFile(id,fid){
  if(!await confirmBox("¿Quitar este archivo de la sección?")) return;
  const n={...S.nodes.get(id)}; n.files=(n.files||[]).filter(f=>f.id!==fid); if(n.cover===fid) n.cover=""; await saveNode(n);
  try{ if(S.assets) await S.assets.delete(fid); }catch(e){}
}

function loadZip(){ return new Promise((res,rej)=>{ if(window.JSZip) return res(window.JSZip); const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload=()=>res(window.JSZip); s.onerror=rej; document.head.appendChild(s); }); }
async function exportVercel(){
  const dl=await claude.use("downloads"); if(!dl){ toast("Este visor no permite descargar archivos."); return; }

    const JSZip=await loadZip(); const z=new JSZip();
    let html=await (await fetch("index.html",{cache:"no-store"})).text();
    html=html.replace("<head>","<head>\n<script>window.__PUBLIC__=true<\/script>");
    z.file("index.html",html);
    for(const f of ["escudo.png","trail.jpg","gl.json"]){ z.file(f,await (await fetch(f)).blob()); }
    const nodes=[...S.nodes.values()].map(n=>{ const o={...n}; delete o.col; return o; });
    z.file("datos.json",JSON.stringify({meta:S.meta,nodes},null,1));
    const rew=[]; const seen=new Set();
    for(const n of nodes) for(const f of (n.files||[])){ if(!f.id||seen.has(f.id)) continue; seen.add(f.id);
      const ext=(f.ext||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
      try{ const b=await (await fetch(blobUrl(f))).blob(); z.file("archivos/"+f.id+"."+ext,b); rew.push({source:"/_blob/"+f.id,destination:"/archivos/"+f.id+"."+ext}); }catch(e){} }
    z.file("vercel.json",JSON.stringify({cleanUrls:true,rewrites:rew,headers:["/","/index.html","/datos.json","/gl.json"].map(s=>({source:s,headers:[{key:"Cache-Control",value:"no-cache"}]}))},null,1));
    z.file("LEEME.txt","A.D.C. BOMBEIROS NARÓN · web pública para Vercel\n\nindex.html  la web\ndatos.json  todo el contenido\ngl.json     traducciones al gallego\narchivos/   fotos, PDF y tracks\nvercel.json configuración (no tocar)\n\nPublicar: sube el contenido de esta carpeta a GitHub (o arrástrala en vercel.com > Add New > Project). Framework: Other, sin build.\nActualizar: edita en el panel privado de Claude, pulsa «Exportar para Vercel» y vuelve a subir.\n");
    const blob=await z.generateAsync({type:"blob"});
    await dl.save({filename:"adc-bombeiros-naron-web.zip",data:blob}); toast("Descargado: súbelo a GitHub o envíamelo por el chat");
  }catch(e){ if(e&&e.code==="declined") return; console.log(e); toast("No se pudo preparar la exportación."); }
}

/* ---------- actualización automática ---------- */
const APP_VER="20261118-2140";
async function checkVersion(){
  try{ const t=await (await fetch("index.html?v="+Date.now(),{cache:"no-store"})).text(); const m=/const APP_VER="([^"]+)"/.exec(t);
    if(m&&m[1]!==APP_VER){ if(S.edit){ if(!S.verWarned){ S.verWarned=true; toast("Hay una versión nueva de la web: se cargará al salir de edición.",5000);} return; } location.reload(); } }catch(e){}
}
setInterval(checkVersion,60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ checkVersion(); if(window.__PUBLIC__) reloadPublic(); } });
async function reloadPublic(){
  try{ const t=await (await fetch("datos.json?v="+Date.now(),{cache:"no-store"})).text(); if(t===S.pubRaw) return; S.pubRaw=t; S.defaults=JSON.parse(t); useDefaults(); route(true); }catch(e){}
}
if(window.__PUBLIC__) setInterval(reloadPublic,120000);

/* ---------- ordenar arrastrando (todo) ---------- */
const HOME_DEF=["accesos","asociacion","noticias"];
function homeOrder(){ const o=(S.meta&&S.meta.homeOrder)||[]; return [...o.filter(k=>HOME_DEF.includes(k)),...HOME_DEF.filter(k=>!o.includes(k))]; }
async function moveSec(k,d){ const o=homeOrder(); const i=o.indexOf(k), j=i+d; if(j<0||j>=o.length) return; [o[i],o[j]]=[o[j],o[i]]; await saveMeta({...S.meta,homeOrder:o}); }
function loadSortable(){ return new Promise((res,rej)=>{ if(window.Sortable) return res(window.Sortable); const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"; s.onload=()=>res(window.Sortable); s.onerror=rej; document.head.appendChild(s); }); }
async function saveOrder(ids){ for(let i=0;i<ids.length;i++){ const n=S.nodes.get(ids[i]); if(n&&(n.order||0)!==i+1) await saveNode({...n,order:i+1}); } toast("Orden guardado"); }
async function saveFileOrder(nodeId,fids){ const n=S.nodes.get(nodeId); if(!n) return; const files=[...(n.files||[])]; const set=new Set(fids);
  const moved=fids.map(id=>files.find(f=>f.id===id)).filter(Boolean); let k=0; const out=files.map(f=>set.has(f.id)?moved[k++]:f); await saveNode({...n,files:out}); toast("Orden guardado"); }
async function initSort(){
  if(!S.edit) return;
  const opts={animation:160,delay:220,delayOnTouchOnly:true,ghostClass:"sghost",chosenClass:"schosen",filter:"button,.ctr,input,textarea",preventOnFilter:false};
  let Sortable; try{ Sortable=await loadSortable(); }catch(e){ return; }
  if(S.owner){ const nav=$("#nav"); if(nav&&!nav._s){ nav._s=Sortable.create(nav,{...opts,draggable:"a[data-id]",onEnd:()=>saveOrder([...nav.querySelectorAll("a[data-id]")].map(a=>a.dataset.id))}); } }
  document.querySelectorAll("[data-sort]").forEach(el=>{ if(el._s) return; const pid=el.dataset.sort; const pn=S.nodes.get(pid);
    if(pid!=="root"&&!canEdit(pn)) return; if(pid==="root"&&!S.owner) return;
    el._s=Sortable.create(el,{...opts,draggable:"[data-id]",group:el.dataset.news?("news-"+pid):undefined,filter:"button,.ctr,input,textarea,select,a.bo",onEnd:async(ev)=>{
      if(el.dataset.news&&ev.to!==ev.from){ const y=ev.to.dataset.year; const id=ev.item.dataset.id; if(/^\d{4}$/.test(y)) await setNewsYear(id,y); else route(true); return; }
      let ids=[...el.querySelectorAll(":scope > [data-id]")].map(x=>x.dataset.id);
      if(el.dataset.news&&pn&&!pn.manualOrder) await saveNode({...pn,manualOrder:true});
      if(pid==="root"){ const asoc=kids("root").find(r=>r.id==="asociacion"); if(asoc){ const at=kids("root").indexOf(asoc); ids.splice(Math.min(at,ids.length),0,"asociacion"); } }
      saveOrder(ids); }}); });
  if(S.owner){ const fl=document.getElementById("fll"); if(fl&&!fl._s){ fl._s=Sortable.create(fl,{...opts,draggable:".fli",onEnd:async()=>{ const L=footLinksOf(); const ord=[...fl.querySelectorAll(".fli")].map(x=>L[+x.dataset.i]).filter(Boolean); await saveMeta({...S.meta,footLinks:ord}); toast("Orden guardado"); }}); } }
  document.querySelectorAll("[data-sortf]").forEach(el=>{ if(el._s) return; const nid=el.dataset.sortf; if(!canEdit(S.nodes.get(nid))) return;
    el._s=Sortable.create(el,{...opts,draggable:"[data-fid]",onEnd:()=>saveFileOrder(nid,[...el.querySelectorAll(":scope > [data-fid]")].map(x=>x.dataset.fid))}); });
}

function footLinkEdit(i){
  const L=[...footLinksOf()]; const it=i>=0?L[i]:["",""];
  const m=modal(`<h3>${i>=0?"Editar":"Nuevo"} acceso directo</h3>
   <div class="fld"><label>Texto</label><input id="flT" value="${esc(it[0])}" placeholder="Concello de Narón"></div>
   <div class="fld"><label>Enlace</label><input id="flU" value="${esc(it[1])}" placeholder="https://…"></div>
   <div class="mact"><button class="btn light" id="mC">Cancelar</button><button class="btn dark" id="mS">Guardar</button></div>`);
  $("#mC",m).onclick=close;
  $("#mS",m).onclick=async()=>{ const t=$("#flT",m).value.trim(); let u=$("#flU",m).value.trim(); if(!t||!u){ toast("Pon el texto y el enlace"); return; }
    if(!/^https?:\/\//i.test(u)) u="https://"+u; if(i>=0) L[i]=[t,u]; else L.push([t,u]); close(); await saveMeta({...S.meta,footLinks:L}); toast("Guardado"); };
}
/* ---------- events ---------- */
const curId=()=>location.hash.startsWith("#n-")?location.hash.slice(3):null;
document.addEventListener("click",async e=>{
  const rm=e.target.closest("[data-rmf]"); if(rm){ e.preventDefault(); e.stopPropagation(); removeFile(curId(),rm.dataset.rmf); return; }
  const cvb=e.target.closest("[data-cover]"); if(cvb){ e.preventDefault(); e.stopPropagation(); setCover(curId(),cvb.dataset.cover); return; }
  const lb=e.target.closest("[data-lb]"); if(lb){ const n=S.nodes.get(curId()); lightbox((n.files||[]).filter(f=>f.kind==="image"),+lb.dataset.lb); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  e.preventDefault(); e.stopPropagation(); const id=b.dataset.id, act=b.dataset.act;
  if(act==="edit") editNode({...S.nodes.get(id)});
  else if(act==="add") addChild(id);
  else if(act==="newnews") addChild("noticias");
  else if(act==="ygo"){ const el=document.getElementById("y-"+id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(act==="secup") moveSec(id,-1);
  else if(act==="newsauto"){ const pn=S.nodes.get(id); if(pn){ await saveNode({...pn,manualOrder:false}); toast("Ordenadas por fecha"); } }
  else if(act==="fladd"||act==="fledit") footLinkEdit(act==="fledit"?+b.dataset.i:-1);
  else if(act==="fldel"){ const L=[...footLinksOf()]; const it=L[+b.dataset.i]; if(it&&await confirmBox(`¿Quitar el acceso «${it[0]}»?`)){ L.splice(+b.dataset.i,1); await saveMeta({...S.meta,footLinks:L}); } }
  else if(act==="secdown") moveSec(id,1);
  else if(act==="car") carGo(b.dataset.i!=null?+b.dataset.i:carI+ +b.dataset.d);
  else if(act==="encuadre") encAbre(id,b.dataset.fid);
  else if(act==="nquitar") removeFileOf(id,b.dataset.fid);
  else if(act==="nretira"||act==="nrest"||act==="nfija"||act==="nsinport"){ const nn={...S.nodes.get(id)}; if(act==="nretira") nn.retirada=true; else if(act==="nrest") nn.retirada=false; else if(act==="nsinport"){ nn.sinPortada=true; nn.fijada=""; } else { nn.fijada=hoyISO(); nn.retirada=false; nn.sinPortada=false; }
    if(await saveNode(nn)) toast(act==="nretira"?"Noticia oculta. Puedes restablecerla en Noticias.":act==="nrest"?"Noticia restablecida":act==="nsinport"?"Quitada de portada: sigue visible en Noticias":"Vuelve a estar en portada"); }
  else if(act==="nborrar"){ if(await confirmBox("¿Borrar para siempre esta noticia? Desaparece de la web y no se puede recuperar.")){ await delNode(id); toast("Noticia borrada"); } }
  else if(act==="settings") settings();
  else if(act==="export") exportVercel();
  else if(act==="upload") pickFiles(id);
  else if(act==="up") move(id,-1);
  else if(act==="down") move(id,1);
  else if(act==="enteredit") setEdit(true);
  else if(act==="exitedit") setEdit(false);
  else if(act==="del"){ const n=S.nodes.get(id); const d=descendants(id).length;
    if(await confirmBox(`¿Eliminar «${n.title}»${d?` y sus ${d} sub-apartados`:""}? No se puede deshacer.`)){ const back=n.parent; await delNode(id); if(curId()===id) location.hash=back==="root"?"inicio":"n-"+back; toast("Eliminado"); } }
});
function setEdit(v){ if(!v) setTimeout(checkVersion,300); if(v&&!S.fromDb){ toast("Conectando con los datos… inténtalo en unos segundos."); return; } S.edit=v; route(true); }
$("#editBtn").onclick=()=>{ if(S.owner) setEdit(!S.edit); };
$("#langBtn").onclick=()=>{ LANG=LANG==="gl"?"es":"gl"; try{localStorage.setItem("adc-lang",LANG)}catch(e){} document.documentElement.lang=LANG; route(true); };
$("#menuBtn").onclick=()=>$("#nav").classList.toggle("open");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
document.addEventListener("change",e=>{ const s=e.target.closest&&e.target.closest("[data-ysel]"); if(s&&s.value){ setNewsYear(s.dataset.ysel,s.value); } });
boot();
})();
